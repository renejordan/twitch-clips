name: Twitch Auto20 - Top 50 ohne API und Freigabevariable

on:
  push:
    paths:
      - .github/workflows/tiktok.yml
  workflow_dispatch:
  schedule:
    - cron: '19 * * * *'

permissions:
  contents: write

concurrency:
  group: twitch-auto20-main
  cancel-in-progress: false

jobs:
  auto20:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clip-Tools installieren
        shell: bash
        run: |
          python -m pip install -U yt-dlp faster-whisper
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Clip suchen, schneiden, als GitHub Release bereitstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_VIEWS: '800'
        run: |
          set -euo pipefail
          cat > pipeline.py <<'PY'
          #!/usr/bin/env python3
          """Twitch Auto20. Public clip discovery without Twitch developer credentials.

          The watchlist is a MANUALLY MAINTAINED SNAPSHOT (August 2026), not an automated
          real-time TwitchTracker ranking. Respect creator reuse rights before publishing.
          """
          import calendar
          import concurrent.futures
          import datetime as dt
          import json
          import math
          import os
          import re
          import subprocess
          import sys
          import textwrap
          import unicodedata
          from pathlib import Path
          from urllib.parse import urlparse

          UTC = dt.timezone.utc
          ROOT = Path.cwd()
          STATE = ROOT / 'state' / 'auto20.json'
          OUT = ROOT / 'rendered'
          # All 50 German TwitchTracker ranked channels in the last accessible snapshot.
          STREAMERS = '''eliasn97 zarbex papaplatte trymacs canerkrd krokoboss xrohat montanablack88 gamerbrother kubafps bonjwa xthesolutiontv handofblood noway4u_sir metashi12 gronkhtv gronkh tolkin gtasty orangemorange schradin dhalucard shlorox mertabimula rumathra elotrix bastighg maxim dracon staiy spontent marli onlyjson naguura phunkroyal niklaswilson pietsmiet scurrows h0llylp rezo letshugotv edopeh amar sterzik repaz gtimetv mckytv rezonfn fregepaul coachlim'''.split()
          RANK = {n: i+1 for i,n in enumerate(STREAMERS)}
          EXCLUDE_IDS = {'GrossTubularAntelopeWow-1KWH2cn3DcuhqWSe'}  # already posted
          KEYWORDS = ('witz', 'lach', 'rage', 'fail', 'krass', 'wtf', 'omg', 'unfassbar', 'ausrast', 'schrei', 'wild', 'haha', 'nein', 'moment', 'reaction', 'peinlich', 'lustig', 'unerwart', 'verrückt')

          def run(args, check=True, **kwargs):
              return subprocess.run(args, text=True, check=check, **kwargs)

          def iso(d):
              return d.astimezone(UTC).strftime('%Y-%m-%dT%H:%M:%SZ')

          def now_utc():
              return dt.datetime.now(UTC)

          def slug(s, n=92):
              a=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              return re.sub(r'-+', '-', re.sub(r'[^a-z0-9]+', '-', a)).strip('-')[:n] or 'clip'

          def clip_url_valid(url):
              try:
                  p=urlparse(url)
                  return p.scheme=='https' and ((p.hostname=='clips.twitch.tv' and bool(p.path.strip('/'))) or (p.hostname in {'twitch.tv','www.twitch.tv'} and bool(re.fullmatch(r'/[^/]+/clip/[^/]+/?', p.path))))
              except Exception: return False

          def read_state():
              if not STATE.exists():return {'version':2,'created':[],'processed_ids':sorted(EXCLUDE_IDS)}
              data=json.loads(STATE.read_text(encoding='utf-8'))
              data.setdefault('created',[]);data.setdefault('processed_ids',[])
              return data

          def save_state(data):
              STATE.parent.mkdir(parents=True,exist_ok=True)
              STATE.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def scheduled_slot(now):
              last=calendar.monthrange(now.year, now.month)[1]
              return math.floor(20*now.day/last)>math.floor(20*(now.day-1)/last)

          def can_prepare(state,now,event='schedule'):
              monthly=[x for x in state['created'] if x.get('created_at','').startswith(now.strftime('%Y-%m'))]
              if len(monthly)>=20:return False,'Monatslimit 20 erreicht'
              if any(x.get('created_at','').startswith(now.strftime('%Y-%m-%d')) for x in monthly):return False,'Heute bereits ein Clip erstellt'
              if event=='schedule':
                  if not scheduled_slot(now):return False,'Heute kein Monatsslot'
                  if not (12<=now.hour<=20):return False,'Warte auf Tageszeitfenster'
              return True,'OK'

          def get_channel_clips(channel,now):
              # Twitch's public clip listing is supported by yt-dlp's TwitchVideosClipsIE.
              source=f'https://www.twitch.tv/{channel}/clips?filter=clips&range=7d'
              try:
                  proc=run(['yt-dlp','--no-warnings','--flat-playlist','--playlist-end','20',
                            '--dump-single-json',source],capture_output=True,timeout=65)
                  page=json.loads(proc.stdout)
                  output=[]
                  for entry in page.get('entries') or []:
                      if not isinstance(entry,dict):continue
                      url=entry.get('url','')
                      if not isinstance(url,str) or not clip_url_valid(url):continue
                      duration=entry.get('duration'); views=entry.get('view_count');timestamp=entry.get('timestamp')
                      if not isinstance(timestamp,(int,float)) or not isinstance(views,int) or not isinstance(duration,(float,int)):continue
                      age=(now-dt.datetime.fromtimestamp(timestamp,UTC)).total_seconds()
                      if not 0<=age<=7*86400:continue
                      id_=str(entry.get('id') or url.split('/')[-1])
                      output.append(dict(id=id_,url=url,channel_login=channel,rank=RANK[channel],
                                         title=str(entry.get('title') or ''),duration=float(duration),
                                         view_count=views,timestamp=timestamp,created_at=iso(dt.datetime.fromtimestamp(timestamp,UTC))))
                  return output
              except Exception as e:
                  print('WARN channel',channel,repr(e)[:170],file=sys.stderr)
                  return []

          def fetch_all(now):
              output=[]
              with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
                  for clips in pool.map(lambda channel:get_channel_clips(channel,now),STREAMERS):
                      output.extend(clips)
              return output

          def score(c,now):
              age=max(2, (now-dt.datetime.fromisoformat(c['created_at'].replace('Z','+00:00'))).total_seconds()/3600)
              views=c['view_count'];speed=views/age
              title=c['title'].lower()
              bonus=sum(s in title for s in KEYWORDS)
              dur=c['duration']
              return 2.3*math.log1p(views)+2.4*math.log1p(speed)+min(bonus,3)*0.8+0.02*(51-c['rank'])-abs(dur-28)/50

          def choose(clips,state,now,min_views=800):
              used=set(state['processed_ids'])|EXCLUDE_IDS|{c['clip_id'] for c in state['created']}
              found={}
              for c in clips:
                  cid=c.get('id')
                  if not cid or cid in used:continue
                  if c.get('channel_login') not in RANK:continue
                  if not clip_url_valid(c.get('url','')):continue
                  if not 15<=float(c.get('duration') or 0)<=60:continue
                  if int(c.get('view_count') or 0)<min_views:continue
                  if len(c.get('title','').strip())<5:continue
                  found[cid]=c
              return sorted(found.values(), key=lambda x:score(x,now),reverse=True)

          def headline(c):
              raw=re.sub(r'[\r\n\x00-\x1f]+',' ',c['title']).strip()
              raw=re.sub(r'[#@][\w]+','',raw)
              raw=re.sub(r'\s+',' ',raw).strip(' -.,?!')
              if len(raw)<8:raw='DIESER MOMENT'
              if len(raw)>41:raw=raw[:40].rstrip(' -.,:')+'…'
              return raw.upper()

          def caption(c):
              name=c['channel_login']
              return f'{c["title"].strip()[:85]} 😂\nClip: @{name}\nQuelle: {c["url"]}\n#{slug(name,24).replace("-","")} #twitchde #streamclips'

          def probe(path,field='duration'):
              if field=='duration':
                  s=run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(path)],capture_output=True).stdout.strip()
                  return float(s)
              return run(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=width,height','-of','csv=s=x:p=0',str(path)],capture_output=True).stdout.strip()

          def download(c):
              OUT.mkdir(exist_ok=True)
              for p in OUT.glob('source.*'):p.unlink()
              run(['yt-dlp','--no-playlist','--retries','3','--merge-output-format','mp4','-o',str(OUT/'source.%(ext)s'),c['url']],timeout=120)
              sources=[p for p in OUT.glob('source.*') if p.suffix.lower() in ('.mp4','.mkv','.webm')]
              if not sources:raise ValueError('Clip-Download lieferte keine Videodatei')
              return sources[0]

          def words_in_video(path):
              try:
                  from faster_whisper import WhisperModel
                  model=WhisperModel('tiny',device='cpu',compute_type='int8',cpu_threads=4)
                  segments,_=model.transcribe(str(path),language='de',beam_size=1,word_timestamps=True,condition_on_previous_text=False)
                  return [(float(w.start),float(w.end),w.word.strip()) for seg in segments for w in (seg.words or []) if w.word.strip()]
              except Exception as ex:
                  print('Optional subtitles not available',repr(ex)[:150]);return []

          def pick_window(duration,words):
              # Trim leading/trailing silence based on detected speech; longer clips use the most spoken 40s.
              if duration<=45:
                  if not words:return 0.0,duration
                  start=min(3.0,max(0.0,words[0][0]-0.7))
                  end=max(duration-3.0,min(duration,words[-1][1]+0.8))
                  if end-start>=12:return round(start,2),round(end-start,2)
                  return 0.0,duration
              length=42.0
              a=max(0,int(duration-length))
              start=max(range(a+1),key=lambda k:sum(k<=((u+v)/2)<k+length for u,v,_ in words)) if words else 0
              return float(start),min(length,duration-start)

          def asstime(s):
              h=int(max(s,0)*100)
              return f'{h//360000}:{(h//6000)%60:02}:{(h//100)%60:02}.{h%100:02}'

          def subtitles(words,start,length,path):
              hdr='''[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\nStyle: TikTok,DejaVu Sans,58,&H00FFFFFF,&H00FFFFFF,&H00000000,&H70000000,-1,0,0,0,100,100,0,0,1,4,1,2,80,80,300,1\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n'''
              active=[(max(0,u-start),min(length,v-start),w) for u,v,w in words if v>start and u<start+length]
              events=[]
              for k in range(0,len(active),3):
                  group=active[k:k+3]
                  a,b=group[0][0],group[-1][1]
                  txt=' '.join(w for _,_,w in group).upper().replace('\\','').replace('{','(').replace('}',')').replace('\n',' ')[:90]
                  events.append(f'Dialogue: 0,{asstime(a)},{asstime(min(length,max(a+0.4,b)))},TikTok,,0,0,0,,{txt}')
              path.write_text(hdr+'\n'.join(events)+'\n',encoding='utf-8')
              return bool(events)

          def render(c,path):
              duration=probe(path)
              if duration<15:raise ValueError('Twitch-Clip unter 15 Sekunden')
              words=words_in_video(path)
              start,length=pick_window(duration,words)
              if length<12:raise ValueError('Zielvideo unter 12 Sekunden')
              head=headline(c)
              (OUT/'headline.txt').write_text('\n'.join(textwrap.wrap(head,21,break_long_words=False)[:3]),encoding='utf-8')
              has_subtitles=subtitles(words,start,length,OUT/'subs.ass')
              filters=("[0:v]split=2[a][b];"
                       "[a]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=20:10[bg];"
                       "[b]scale=1080:1500:force_original_aspect_ratio=decrease,setsar=1[fg];"
                       "[bg][fg]overlay=(W-w)/2:(H-h)/2,"
                       "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=rendered/headline.txt:fontsize=54:fontcolor=white:borderw=3:bordercolor=black:box=1:boxcolor=black@0.65:boxborderw=15:x=(w-text_w)/2:y=220,")
              if has_subtitles:filters+='ass=rendered/subs.ass,'
              filters+='format=yuv420p[v]'
              movie=OUT/'tiktok.mp4'
              run(['ffmpeg','-y','-hide_banner','-loglevel','error','-ss',str(start),'-t',str(length),'-i',str(path),'-filter_complex',filters,'-map','[v]','-map','0:a:0?','-c:v','libx264','-preset','veryfast','-crf','23','-r','30','-c:a','aac','-b:a','160k','-movflags','+faststart',str(movie)],timeout=360)
              if not 12<=probe(movie)<=65 or probe(movie,'size')!='1080x1920':raise ValueError('MP4-Kontrolle fehlgeschlagen')
              cover=OUT/'cover.jpg'
              run(['ffmpeg','-y','-hide_banner','-loglevel','error','-ss','1','-i',str(movie),'-frames:v','1','-q:v','3',str(cover)],timeout=30)
              return movie,cover,has_subtitles

          def publish_release(c,movie,cover,now):
              repo=os.environ.get('GITHUB_REPOSITORY','')
              if not re.fullmatch(r'[\w.-]+/[\w.-]+',repo):raise ValueError('GitHub-Repository fehlt')
              tag=f'tiktok-{now:%Y-%m}'
              asset=slug(c['channel_login']+'-'+c['id'])
              video_name=asset+'.mp4';cover_name=asset+'-cover.jpg'
              video_file=OUT/video_name;video_file.write_bytes(movie.read_bytes())
              cover_file=OUT/cover_name;cover_file.write_bytes(cover.read_bytes())
              found=run(['gh','release','view',tag,'-R',repo],capture_output=True,check=False)
              if found.returncode!=0:
                  run(['gh','release','create',tag,'-R',repo,'--title',f'Video-Kandidaten {now:%Y-%m}','--notes','Automatisch vorbereitete Twitch-Clips, bitte Nutzungsrechte beachten.'],timeout=60)
              run(['gh','release','upload',tag,str(video_file),str(cover_file),'-R',repo,'--clobber'],timeout=120)
              prefix=f'https://github.com/{repo}/releases/download/{tag}/'
              return prefix+video_name,prefix+cover_name

          def main():
              now=now_utc(); state=read_state()
              allowed,reason=can_prepare(state,now,os.getenv('GITHUB_EVENT_NAME','schedule'))
              if not allowed:
                  print('SKIP:',reason);return
              all_clips=fetch_all(now)
              ranked=choose(all_clips,state,now,int(os.getenv('MIN_VIEWS','800')))
              print('Clip-Kandidaten:',len(all_clips),'qualifiziert:',len(ranked),'Kanaele:',len(STREAMERS))
              for c in ranked[:5]:
                  try:
                      print('TEST CLIP',c['channel_login'],c['id'],c['view_count'],c['duration'])
                      source=download(c)
                      video,cover,has_subs=render(c,source)
                      url,cover_url=publish_release(c,video,cover,now)
                      record={'clip_id':c['id'],'streamer':c['channel_login'],'source_url':c['url'],
                              'original_title':c['title'],'hook':headline(c),'caption':caption(c),
                              'views_at_selection':c['view_count'],'original_duration':c['duration'],
                              'video_url':url,'cover_url':cover_url,'transcript_subtitles':has_subs,
                              'created_at':iso(now),'status':'awaiting_metricool',
                              'rights_status':'user_asserted_not_independently_verified'}
                      state['created'].append(record)
                      state['processed_ids'].append(c['id'])
                      save_state(state)
                      print('VIDEO READY:',json.dumps(record,ensure_ascii=False))
                      summary=os.getenv('GITHUB_STEP_SUMMARY')
                      if summary:
                          with open(summary,'a',encoding='utf-8') as f:
                              f.write(f'## Neuer TikTok-Kandidat: {c["channel_login"]}\n')
                              f.write(f'- {c["view_count"]} Aufrufe, {c["duration"]} Sekunden\n')
                              f.write(f'- [MP4]({url}) | [Cover]({cover_url})\n')
                              f.write('- Noch **nicht** auf TikTok veröffentlicht.\n')
                      return
                  except Exception as e:
                      print('WARN video failed:',repr(e),file=sys.stderr)
              print('Kein neuer Clip erstellt. Keine automatische Veroeffentlichung.')

          def self_test():
              assert len(STREAMERS)==50 and len(set(STREAMERS))==50
              now=dt.datetime(2026,10,13,18,tzinfo=UTC)
              testclip={'id':'test-123','url':'https://clips.twitch.tv/TestClipSlug','channel_login':'papaplatte',
                        'rank':3,'duration':24,'view_count':17000,'title':'Was ein witziger Moment','created_at':iso(now-dt.timedelta(hours=3))}
              s={'created':[],'processed_ids':['GrossTubularAntelopeWow-1KWH2cn3DcuhqWSe']}
              assert choose([testclip],s,now)[0]['id']=='test-123'
              s['processed_ids'].append('test-123')
              assert choose([testclip],s,now)==[]
              assert not choose([dict(testclip,id='bad',duration=5)],{'created':[],'processed_ids':[]},now)
              assert sum(scheduled_slot(dt.datetime(2026,10,d,tzinfo=UTC)) for d in range(1,32))==20
              assert sum(scheduled_slot(dt.datetime(2027,2,d,tzinfo=UTC)) for d in range(1,29))==20
              assert can_prepare({'created':[],'processed_ids':[]},now,'push')[0]
              assert 'papaplatte' in caption(testclip)
              assert ('vars.'+'APPROVED'+'_'+'STREAMERS') not in Path(__file__).read_text()
              print('SELFTEST OK: 50 Kanaele, Dubletten, Dauer, Ranking, 20 Slots/Monat, keine APPROVED_STREAMERS-Variable')

          if __name__=='__main__':
              if '--self-test' in sys.argv:self_test()
              else:main()
          PY
          python pipeline.py --self-test
          python pipeline.py
          if [ -f state/auto20.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/auto20.json
            if ! git diff --cached --quiet; then
              git commit -m 'Auto20: Clip bereitgestellt'
              git push origin HEAD:main
            fi
          fi
          echo 'Fertige Clips und Warteschlange: https://raw.githubusercontent.com/${{ github.repository }}/main/state/auto20.json' >> "$GITHUB_STEP_SUMMARY"
