name: TikTok14 – offline validation (live publishing on hold)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/tiktok14.yml'
      - '.github/workflows/tiktok.yml'
      - 'scripts/tiktok14_*.py'
      - 'tests/**'
  push:
    paths:
      - '.github/workflows/tiktok14.yml'
      - 'scripts/tiktok14_*.py'
      - 'tests/**'
  schedule:
    - cron: '33 * * * *'

permissions:
  contents: read

concurrency:
  group: tiktok14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'schedule' || vars.TIKTOK14_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, observed in run #1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, observed in run #1
        with:
          python-version: '3.12'
      - name: Offline tests without credentials, downloads or uploads
        run: |
          python scripts/tiktok14_prepare.py --test
          python scripts/tiktok14_publish.py selftest
          python -m unittest discover -s tests -v

  auto14:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.TIKTOK14_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Refuse live operations until commissioning is implemented and verified
        run: python scripts/tiktok14_publish.py preflight
