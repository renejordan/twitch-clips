name: TikTok14 – independent Buffer publisher

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'prepare = review candidate only; diagnose = metadata only; commission/auto = main publisher with media review gate'
        type: choice
        options:
          - prepare
          - commission
          - diagnose
          - auto
        default: prepare
  pull_request:
    paths:
      - '.github/workflows/tiktok14.yml'
      - '.github/workflows/tiktok.yml'
      - 'scripts/tiktok14_*.py'
      - 'scripts/tiktok14_config.json'
      - 'requirements-tiktok14.txt'
      - 'tests/**'
  push:
    paths:
      - '.github/workflows/tiktok14.yml'
      - 'scripts/tiktok14_*.py'
      - 'scripts/tiktok14_config.json'
      - 'requirements-tiktok14.txt'
      - 'tests/**'
  schedule:
    # Best effort only. External tiktok14_dispatch.py can use workflow_dispatch.
    # Completed hourly scans and send reservations suppress duplicate work.
    - cron: '11,31,51 * * * *'

permissions:
  contents: read

concurrency:
  group: tiktok14-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name != 'schedule' || vars.TIKTOK14_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, observed in run #1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, observed in run #1
        with:
          python-version: '3.12'
      - name: Offline tests without credentials, downloads or uploads
        run: |
          python scripts/tiktok14_prepare.py --test
          python scripts/tiktok14_publish.py selftest
          python -m unittest discover -s tests -v

  auto14:
    needs: validate
    if: ${{ (github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && vars.TIKTOK14_ENABLED == 'true') || github.event_name == 'workflow_dispatch')) || ((github.ref == 'refs/heads/codex/tiktok14-safety-audit' || github.ref == 'refs/heads/codex/tiktok14-reliability') && github.event_name == 'workflow_dispatch' && (inputs.mode == 'prepare' || inputs.mode == 'diagnose')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install media tools before any service credential is exposed
        run: |
          python -m pip install --disable-pip-version-check -r requirements-tiktok14.txt
          python -m pip check
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Prepare review candidate or inspect metadata without publication
        env:
          GH_TOKEN: ${{ github.token }}
          HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
          TIKTOK14_ACTION: ${{ inputs.mode == 'diagnose' && 'diagnose' || 'prepare' }}
        run: python scripts/tiktok14_cloud.py "$TIKTOK14_ACTION"
      - name: Publish or reconcile one reserved post via Buffer
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.mode == 'commission' || (inputs.mode == 'auto' && vars.TIKTOK14_ENABLED == 'true')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/tiktok14_cloud.py publish

  buffer_connection:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'auto' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/tiktok14-safety-audit' || github.ref == 'refs/heads/codex/tiktok14-reliability') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Read-only Buffer identity and connection check
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/tiktok14_buffer_check.py
